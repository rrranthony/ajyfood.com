name: Build and deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build site into _site/
      run: python build.py

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    # Recipe pages have no file extension, so label them as HTML explicitly.
    # --delete removes pages for recipes that no longer exist.
    - name: Sync recipe pages
      run: aws s3 sync _site/recipes s3://ajyfood.com/recipes --content-type text/html --delete

    # Index, 404, CSS and favicon: S3 picks the right type from the extension.
    - name: Sync top-level files
      run: aws s3 sync _site s3://ajyfood.com --exclude "recipes/*"
